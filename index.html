<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sturgeon - 个人主页</title>
    <style>
        /* ================= 莫奈取色与 MiUIX 全局变量 ================= */
        :root {
            --accent-blue: #0066ff;             /* 小米/HyperOS 经典蓝 */
            --miui-radius-lg: 24px;             /* MiUIX 大圆角 */
            --miui-radius-sm: 14px;             /* 小圆角 */
            --blur-glass: blur(20px) saturate(180%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "MiSans", "PingFang SC", sans-serif;
            overflow: hidden;
            background-color: #1a1b26;
        }

        /* ================= 左上角 Logo 标识 ================= */
        .top-header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            padding: 8px 20px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* ================= 全屏图片/渐变滑动 ================= */
        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .page {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }

        .page-1 {
            background: linear-gradient(135deg, rgba(43,50,178,0.7) 0%, rgba(20,136,204,0.7) 100%), 
                        url('images/bg1.jpg'), url('https://picsum.photos/id/1015/1920/1080');
            background-size: cover;
            background-blend-mode: overlay;
        }

        .page-2 {
            background: linear-gradient(135deg, rgba(58,28,113,0.7) 0%, rgba(215,109,119,0.7) 100%), 
                        url('images/bg2.jpg'), url('https://picsum.photos/id/1043/1920/1080');
            background-size: cover;
            background-blend-mode: overlay;
        }

        .page-3 {
            background: linear-gradient(135deg, rgba(31,64,55,0.7) 0%, rgba(153,242,200,0.7) 100%), 
                        url('images/bg3.jpg'), url('https://picsum.photos/id/1039/1920/1080');
            background-size: cover;
            background-blend-mode: overlay;
        }

        .hero-title {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            padding: 0 20px;
        }

        .hero-title h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .hero-title p {
            font-size: 1rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* ================= 右上角悬浮胶囊侧边栏 (MiUIX 小窗设计) ================= */
        .sidebar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            
            /* 收起状态：右上角小胶囊按钮 */
            width: 95px;
            height: 40px;
            border-radius: 20px;
            padding: 0 14px;
            
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        /* 鼠标悬停 / 手机点击时：展开成功能面板 */
        .sidebar:hover {
            width: 280px;
            height: auto;
            max-height: 80vh;
            border-radius: var(--miui-radius-lg);
            padding: 18px 18px 22px 18px;
            background: rgba(255, 255, 255, 0.92);
        }

        /* 胶囊顶部栏 / 指示标记 */
        .sidebar-handle {
            height: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .sidebar-handle .handle-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .sidebar-handle .handle-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 102, 255, 0.6);
        }

        /* 展开内容容器 */
        .sidebar-content {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s;
            pointer-events: none;
            margin-top: 10px;
        }

        .sidebar:hover .sidebar-content {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ================= 独创“预测性点击”按钮 ================= */
        .predictive-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: var(--miui-radius-sm);
            padding: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            overflow: hidden;
        }

        .predictive-btn .btn-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .predictive-btn .btn-preview {
            max-height: 0;
            opacity: 0
