<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sturgeon - 个人主页</title>
    <style>
        /* ================= 莫奈取色与 全局变量 ================= */
        :root {
            --accent-blue: #0066ff;
            --miui-radius-lg: 28px;
            --miui-radius-sm: 16px;
            
            /* 清透折射玻璃滤镜 */
            --liquid-glass-filter: blur(8px) saturate(170%) contrast(105%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "MiSans", sans-serif;
            overflow: hidden;
            background-color: #0f1015;
        }

        /* ================= 左上角 Logo 标识 & 折射玻璃展开菜单 ================= */
        .top-header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
        }

        .logo-menu {
            /* 默认状态：左上角折射玻璃小胶囊 */
            width: 115px;
            height: 42px;
            border-radius: 25px;
            padding: 0 16px;
            
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 100%);
            backdrop-filter: var(--liquid-glass-filter);
            -webkit-backdrop-filter: var(--liquid-glass-filter);
            
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                inset 1.5px 1.5px 0px 0px rgba(255, 255, 255, 0.9),
                inset -1.5px -1.5px 1px 0px rgba(0, 0, 0, 0.2),
                inset 0 0 15px 0 rgba(255, 255, 255, 0.2),
                0 12px 32px rgba(0, 0, 0, 0.25);
            
            overflow: hidden;
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.12);
            display: flex;
            flex-direction: column;
        }

        /* 悬停或激活（点击）时展开 */
        .logo-menu:hover, .logo-menu.active {
            width: 270px;
            height: auto;
            max-height: 80vh;
            border-radius: var(--miui-radius-lg);
            padding: 16px 16px 20px 16px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.15) 100%);
            box-shadow: 
                inset 2px 2px 1px 0px rgba(255, 255, 255, 0.95),
                inset -1.5px -1.5px 1px 0px rgba(0, 0, 0, 0.2),
                inset 0 0 20px 0 rgba(255, 255, 255, 0.25),
                0 20px 48px rgba(0, 0, 0, 0.35);
        }

        .logo-handle {
            height: 42px;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .logo-handle .logo-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .logo-handle .logo-arrow {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease;
        }

        .logo-menu:hover .logo-arrow, .logo-menu.active .logo-arrow {
            transform: rotate(180deg);
        }

        .logo-content {
            opacity: 0;
            transform: translateY(-8px) scale(0.98);
            transition: opacity 0.35s ease 0.1s, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s;
            pointer-events: none;
            margin-top: 10px;
        }

        .logo-menu:hover .logo-content, .logo-menu.active .logo-content {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* ================= 全屏图片/渐变滑动 ================= */
        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .page {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }

        .page-1 {
            background: linear-gradient(135deg, rgba(43,50,178,0.7) 0%, rgba(20,136,204,0.7) 100%), 
                        url('images/bg1.jpg'), url('https://picsum.photos/id/1015/1920/1080');
            background-size: cover;
            background-blend-mode: overlay;
        }

        .page-2 {
            background: linear-gradient(135deg, rgba(58,28,113,0.7) 0%, rgba(215,109,119,0.7) 100%), 
                        url('images/bg2.jpg'), url('https://picsum.photos/id/1043/1920/1080');
            background-size: cover;
            background-blend-mode: overlay;
        }

        .page-3 {
            background: linear-gradient(135deg, rgba(31,64,55,0.7) 0%, rgba(153,242,200,0.7) 100%), 
                        url('images/bg3.jpg'), url('https://picsum.photos/id/1039/1920/1080');
            background-size: cover;
            background-blend-mode: overlay;
        }

        .hero-title {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            padding: 0 20px;
        }

        .hero-title h1 {
            font-size: 2.4rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-title p {
            font-size: 1.05rem;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        /* ================= 清透折射玻璃右上角菜单 ================= */
        .sidebar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            
            /* 收起状态：玻璃胶囊 */
            width: 100px;
            height: 42px;
            border-radius: 25px;
            padding: 0 16px;
            
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 100%);
            backdrop-filter: var(--liquid-glass-filter);
            -webkit-backdrop-filter: var(--liquid-glass-filter);
            
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                inset 1.5px 1.5px 0px 0px rgba(255, 255, 255, 0.9),
                inset -1.5px -1.5px 1px 0px rgba(0, 0, 0, 0.2),
                inset 0 0 15px 0 rgba(255, 255, 255, 0.2),
                0 12px 32px rgba(0, 0, 0, 0.25);
            
            overflow: hidden;
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.12);
            display: flex;
            flex-direction: column;
        }

        .sidebar:hover {
            width: 290px;
            height: auto;
            max-height: 80vh;
            border-radius: var(--miui-radius-lg);
            padding: 18px 18px 22px 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.15) 100%);
            box-shadow: 
                inset 2px 2px 1px 0px rgba(255, 255, 255, 0.95),
                inset -1.5px -1.5px 1px 0px rgba(0, 0, 0, 0.2),
                inset 0 0 20px 0 rgba(255, 255, 255, 0.25),
                0 20px 48px rgba(0, 0, 0, 0.35);
        }

        .sidebar-handle {
            height: 42px;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .sidebar-handle .handle-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .sidebar-handle .handle-dot {
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        .sidebar-content {
            opacity: 0;
            transform: translateY(-8px) scale(0.98);
            transition: opacity 0.35s ease 0.1s, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s;
            pointer-events: none;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        .sidebar:hover .sidebar-content {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ================= 折射玻璃小卡片按钮 ================= */
        .predictive-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.1) 100%);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: var(--miui-radius-sm);
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 
                inset 1px 1px 0px 0 rgba(255, 255, 255, 0.7),
                0 4px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .predictive-btn .btn-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .predictive-btn .btn-preview {
            max-height: 0;
            opacity: 0;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            line-height: 1.4;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .predictive-btn.holding {
            transform: scale(1.04);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.2) 100%);
            border-color: rgba(255, 255, 255, 0.85);
            box-shadow: 
                inset 1.5px 1.5px 0px 0 rgba(255, 255, 255, 0.95),
                0 8px 24px rgba(0, 102, 255, 0.35);
            z-index: 10;
        }

        .predictive-btn.holding .btn-preview {
            max-height: 80px;
            opacity: 1;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="logo-menu" id="logoMenu">
            <div class="logo-handle">
                <span class="logo-title">Sturgeon</span>
                <span class="logo-arrow">▾</span>
            </div>
            <div class="logo-content">
                <div class="menu-list">
                    <div class="predictive-btn" data-href="changelog.html">
                        <div class="btn-title">📝 开发日志 <span>→</span></div>
                        <div class="btn-preview">查看网站的版本迭代记录、功能更新与修补日志。</div>
                    </div>

                    <div class="predictive-btn" data-href="https://github.com/SturgeonIsSleepy/guest.sturgeon.ccwu.cc" data-external="true">
                        <div class="btn-title">💻 网站源代码 <span>→</span></div>
                        <div class="btn-preview">前往 GitHub 查看项目开源仓库、代码结构与资源。</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <div class="sidebar-handle">
            <span class="handle-title">⚡ 菜单</span>
            <span class="handle-dot"></span>
        </div>

        <div class="sidebar-content">
            <div class="menu-list">
                <div class="predictive-btn" data-href="mbti.html">
                    <div class="btn-title">🧠 MBTI 测试 <span>→</span></div>
                    <div class="btn-preview">探索你的性格类型与内在潜能，提供多维度解析。</div>
                </div>

                <div class="predictive-btn" data-href="f1.html">
                    <div class="btn-title">🏎️ F1 赛历 <span>→</span></div>
                    <div class="btn-preview">实时查阅本赛季一级方程式赛车各分站时间与地点。</div>
                </div>

                <div class="predictive-btn" data-href="movies.html">
                    <div class="btn-title">🎬 观影记录 <span>→</span></div>
                    <div class="btn-preview">记录我看过的影视作品，包含评分与个人独家短评。</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="scroll-container">
        <section class="page page-1">
            <div class="hero-title">
                <h1>这是 Sturgeon 的网站主页</h1>
                <p>向下滑动探索更多功能 | 点击两侧导航展开菜单</p>
            </div>
        </section>

        <section class="page page-2">
            <div class="hero-title">
                <h1>极简 · 灵动 · 沉浸</h1>
                <p>透亮折射玻璃与莫奈调色的融合</p>
            </div>
        </section>

        <section class="page page-3">
            <div class="hero-title">
                <h1>热爱生活与探索</h1>
                <p>速度、性格与光影的汇聚地</p>
            </div>
        </section>
    </main>

    <script>
        // --- 1. 左上角 Logo 菜单点击控制 ---
        const logoMenu = document.getElementById('logoMenu');
        const logoHandle = logoMenu.querySelector('.logo-handle');

        logoHandle.addEventListener('click', (e) => {
            e.stopPropagation();
            logoMenu.classList.toggle('active');
        });

        // 点击页面空白处关闭左上角菜单
        document.addEventListener('click', (e) => {
            if (!logoMenu.contains(e.target)) {
                logoMenu.classList.remove('active');
            }
        });

        // --- 2. 通用“预测性长按/点击”逻辑 ---
        document.querySelectorAll('.predictive-btn').forEach(btn => {
            let isHolding = false;

            const executeNavigation = () => {
                const targetUrl = btn.getAttribute('data-href');
                const isExternal = btn.getAttribute('data-external') === 'true';
                if (targetUrl) {
                    if (isExternal) {
                        window.open(targetUrl, '_blank');
                    } else {
                        window.location.href = targetUrl;
                    }
                }
            };

            btn.addEventListener('mousedown', () => {
                isHolding = true;
                btn.classList.add('holding');
            });

            btn.addEventListener('mouseup', () => {
                if (isHolding) {
                    isHolding = false;
                    btn.classList.remove('holding');
                    executeNavigation();
                }
            });

            btn.addEventListener('mouseleave', () => {
                if (isHolding) {
                    isHolding = false;
                    btn.classList.remove('holding');
                }
            });

            btn.addEventListener('touchstart', () => {
                isHolding = true;
                btn.classList.add('holding');
            });

            btn.addEventListener('touchend', () => {
                if (isHolding) {
                    isHolding = false;
                    btn.classList.remove('holding');
                    executeNavigation();
                }
            });

            btn.addEventListener('touchcancel', () => {
                if (isHolding) {
                    isHolding = false;
                    btn.classList.remove('holding');
                }
            });
        });
    </script>
</body>
</html>
