<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sturgeon's Movies - 观影记录</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--border); color: var(--text-main); }
    .btn-danger { background: var(--danger); color: white; }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .tab {
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 6px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .tab.active {
      background: var(--card-bg);
      color: var(--primary);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .movie-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .movie-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .rating {
      color: var(--accent);
      font-weight: bold;
    }

    .external-box {
      background: rgba(56, 189, 248, 0.05);
      border-left: 3px solid var(--primary);
      padding: 8px 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
      border-radius: 0 4px 4px 0;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Modal 弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-content input, .modal-content textarea, .modal-content select {
      width: 100%;
      padding: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: white;
      border-radius: 6px;
    }

    .fab {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: var(--primary);
      color: #0f172a;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎬 Sturgeon Movies</div>
    <div class="user-actions">
      <span id="userInfo" style="font-size: 0.9rem; color: var(--text-muted);">未登录</span>
      <button class="btn" id="authBtn" onclick="toggleAuthModal()">登录 / 注册</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('all', this)">全部</div>
      <div class="tab" onclick="switchTab('watched', this)">已观看</div>
      <div class="tab" onclick="switchTab('plan', this)">观影计划</div>
    </div>

    <div class="movie-grid" id="movieGrid">
      </div>
  </div>

  <div class="fab" onclick="openAddModal()">+</div>

  <div class="modal" id="authModal">
    <div class="modal-content">
      <h3 id="modalTitle">登录</h3>
      <input type="text" id="authUsername" placeholder="用户名">
      <input type="password" id="authPassword" placeholder="密码">
      <button class="btn" onclick="submitAuth()">提交</button>
      <button class="btn btn-secondary" onclick="switchAuthMode()" id="switchAuthBtn">没有账号？去注册</button>
      <button class="btn btn-danger" onclick="closeModal('authModal')">取消</button>
    </div>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>添加新影片</h3>
      <input type="text" id="movieTitle" placeholder="影片名称">
      <select id="movieType">
        <option value="watched">已观看</option>
        <option value="plan">计划看</option>
      </select>
      <input type="number" id="movieRating" placeholder="评分 (1-10)" min="1" max="10">
      <textarea id="movieDesc" placeholder="观影心得 / 备注"></textarea>
      <button class="btn" onclick="submitAddMovie()">保存</button>
      <button class="btn btn-danger" onclick="closeModal('addModal')">取消</button>
    </div>
  </div>

  <script>
    // ⚠️ 注意：将这里的 URL 替换为你真实的 Cloudflare Worker 域名！
    const API_BASE = 'https://sturgeon-movies-api.zhx100560.workers.dev/api';

    let isRegisterMode = false;
    let currentTab = 'all';
    let moviesData = [];

    // 页面加载完成初始化
    window.onload = () => {
      checkAuthStatus();
      if (getToken()) {
        fetchMovies();
      }
    };

    function getToken() {
      return localStorage.getItem('token');
    }

    function checkAuthStatus() {
      const username = localStorage.getItem('username');
      const userInfo = document.getElementById('userInfo');
      const authBtn = document.getElementById('authBtn');

      if (username && getToken()) {
        userInfo.innerText = `👋 欢迎，${username}`;
        authBtn.innerText = '退出登录';
        authBtn.onclick = logout;
      } else {
        userInfo.innerText = '未登录';
        authBtn.innerText = '登录 / 注册';
        authBtn.onclick = () => openModal('authModal');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      moviesData = [];
      renderMovies();
      checkAuthStatus();
    }

    // API 访问统一辅助函数
    async function apiFetch(endpoint, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      const token = getToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);

      const res = await fetch(`${API_BASE}${endpoint}`, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    // 获取并渲染影片
    async function fetchMovies() {
      try {
        moviesData = await apiFetch('/movies');
        renderMovies();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderMovies() {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';

      const filtered = moviesData.filter(m => {
        if (currentTab === 'all') return true;
        return m.type === currentTab;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">暂无记录，点击右下角 + 按钮添加吧！</div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';

        let extHtml = '';
        if (m.type === 'plan' && m.external_rating) {
          extHtml = `
            <div class="external-box">
              ⭐ 推荐评分: <strong>${m.external_rating}</strong><br>
              ${m.external_comment || ''}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="movie-title">${m.title}</div>
          <div class="movie-meta">
            ${m.type === 'watched' ? '✅ 已观看' : '📌 计划看'} 
            ${m.rating ? `| <span class="rating">★ ${m.rating}/10</span>` : ''}
          </div>
          ${m.description ? `<p style="font-size: 0.9rem; color: #cbd5e1;">${m.description}</p>` : ''}
          ${extHtml}
          <div class="card-actions">
            ${m.type === 'plan' ? `<button class="btn btn-secondary" onclick="markAsWatched(${m.id})">标记已看</button>` : ''}
            <button class="btn btn-danger" onclick="deleteMovie(${m.id})">删除</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 交互逻辑
    function switchTab(type, el) {
      currentTab = type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderMovies();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function switchAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('modalTitle').innerText = isRegisterMode ? '注册' : '登录';
      document.getElementById('switchAuthBtn').innerText = isRegisterMode ? '已有账号？去登录' : '没有账号？去注册';
    }

    async function submitAuth() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      if (!username || !password) return alert('请填写用户名和密码');

      try {
        const endpoint = isRegisterMode ? '/register' : '/login';
        const res = await apiFetch(endpoint, 'POST', { username, password });

        if (isRegisterMode) {
          alert('注册成功，请重新登录');
          switchAuthMode();
        } else {
          localStorage.setItem('token', res.token);
          localStorage.setItem('username', res.username);
          closeModal('authModal');
          checkAuthStatus();
          fetchMovies();
        }
      } catch (err) {
        alert(err.message);
      }
    }

    function openAddModal() {
      if (!getToken()) return alert('请先登录后再添加记录');
      openModal('addModal');
    }

    async function submitAddMovie() {
      const title = document.getElementById('movieTitle').value.trim();
      const type = document.getElementById('movieType').value;
      const rating = parseFloat(document.getElementById('movieRating').value) || 0;
      const description = document.getElementById('movieDesc').value.trim();

      if (!title) return alert('请输入影片名称');

      try {
        await apiFetch('/movies', 'POST', { title, type, rating, description });
        closeModal('addModal');
        document.getElementById('movieTitle').value = '';
        document.getElementById('movieDesc').value = '';
        fetchMovies();
      } catch (err) {
        alert(err.message);
      }
    }

    async function markAsWatched(id) {
      const rating = prompt('请输入你的评分 (1-10)：', '8');
      if (rating === null) return;

      try {
        await apiFetch(`/movies/${id}`, 'PUT', {
          type: 'watched',
          rating: parseFloat(rating) || 0,
          description: '已更新为已观看'
        });
        fetchMovies();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteMovie(id) {
      if (!confirm('确定要删除这部影片记录吗？')) return;
      try {
        await apiFetch(`/movies/${id}`, 'DELETE');
        fetchMovies();
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
