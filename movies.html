<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sturgeon's Movies - 观影记录</title>
  <style>
    :root {
      --bg-overlay: rgba(10, 15, 30, 0.55);
      --glass-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03));
      --glass-card-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-border-hover: rgba(255, 255, 255, 0.45);
      --glass-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --primary: #38bdf8;
      --accent: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* 独立背景层：略微模糊与放大的毛玻璃壁纸 */
    body::before {
      content: "";
      position: fixed;
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                  url('https://truth.bahamut.com.tw/s01/202308/8b4c68abf876aad7ebe2e8c002fbad4b.JPG') no-repeat center center;
      background-size: cover;
      filter: blur(10px);
      transform: scale(1.05);
      z-index: -1;
    }

    /* 顶栏 - 液态玻璃 */
    header {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-glow);
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 通用液态玻璃按键 */
    .btn {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.75), rgba(56, 189, 248, 0.45));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), var(--glass-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(56, 189, 248, 0.65));
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4), var(--glass-glow);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-secondary {
      background: var(--glass-gradient);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }
    .btn-secondary:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.08));
      border-color: var(--glass-border-hover);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), var(--glass-glow);
    }

    .btn-danger {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.7), rgba(239, 68, 68, 0.4));
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn-danger:hover {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.95), rgba(239, 68, 68, 0.7));
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4), var(--glass-glow);
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* 选项卡栏 */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      padding: 6px;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.3), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(20px) saturate(180%);
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-glow);
      width: fit-content;
    }

    .tab {
      padding: 8px 22px;
      cursor: pointer;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: var(--glass-gradient);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3), var(--glass-glow);
    }

    /* 电影网格 */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* 电影卡片 - 高质感液态玻璃 */
    .movie-card {
      background: var(--glass-card-gradient);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-glow);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .movie-card:hover {
      transform: translateY(-6px);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
      border-color: var(--glass-border-hover);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), var(--glass-glow);
    }

    .movie-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .movie-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .rating {
      color: var(--accent);
      font-weight: bold;
    }

    /* 推荐评价框 - 玻璃凹槽 */
    .external-box {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(56, 189, 248, 0.03));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-left: 4px solid var(--primary);
      padding: 12px;
      font-size: 0.85rem;
      color: #e2e8f0;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 8px;
    }

    /* Modal 弹窗 - 深度液态玻璃 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid var(--glass-border-hover);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), var(--glass-glow);
      padding: 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-content input, .modal-content textarea, .modal-content select {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.35), rgba(255, 255, 255, 0.05));
      border: 1px solid var(--glass-border);
      color: white;
      border-radius: 12px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .modal-content select option {
      background: #1e293b;
      color: white;
    }

    .modal-content input:focus, .modal-content textarea:focus, .modal-content select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* 悬浮 + 号添加按钮 */
    .fab {
      position: fixed;
      bottom: 35px;
      right: 35px;
      width: 62px;
      height: 62px;
      border-radius: 31px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(56, 189, 248, 0.5));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4), var(--glass-glow);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fab:hover {
      transform: scale(1.12) rotate(90deg);
      background: linear-gradient(135deg, rgba(56, 189, 248, 1), rgba(56, 189, 248, 0.7));
      box-shadow: 0 15px 35px rgba(56, 189, 248, 0.6), var(--glass-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="btn btn-secondary">🏠 返回首页</a>
      <div class="logo">🎬 Sturgeon Movies</div>
    </div>
    <div class="user-actions">
      <span id="userInfo" style="font-size: 0.9rem; color: var(--text-muted);">未登录</span>
      <button class="btn" id="authBtn" onclick="toggleAuthModal()">登录 / 注册</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('all', this)">全部</div>
      <div class="tab" onclick="switchTab('watched', this)">已观看</div>
      <div class="tab" onclick="switchTab('plan', this)">观影计划</div>
    </div>

    <div class="movie-grid" id="movieGrid">
      </div>
  </div>

  <div class="fab" onclick="openAddModal()">+</div>

  <div class="modal" id="authModal">
    <div class="modal-content">
      <h3 id="modalTitle">登录</h3>
      <input type="text" id="authUsername" placeholder="用户名">
      <input type="password" id="authPassword" placeholder="密码">
      <button class="btn" onclick="submitAuth()">提交</button>
      <button class="btn btn-secondary" onclick="switchAuthMode()" id="switchAuthBtn">没有账号？去注册</button>
      <button class="btn btn-danger" onclick="closeModal('authModal')">取消</button>
    </div>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>添加新作品</h3>
      <input type="text" id="movieTitle" placeholder="作品名称 (如: 星际穿越 / 鬼灭之刃 / 狂飙)">
      
      <select id="mediaCategory">
        <option value="movie">🎬 电影</option>
        <option value="tv">📺 剧集 / 电视剧</option>
        <option value="anime">🎨 动漫 / 动画</option>
      </select>

      <select id="movieType">
        <option value="watched">已观看</option>
        <option value="plan">计划看</option>
      </select>
      <input type="number" id="movieRating" placeholder="个人评分 (1-10，选填)" min="1" max="10">
      <textarea id="movieDesc" placeholder="观影心得 / 备注" rows="3"></textarea>
      <button class="btn" onclick="submitAddMovie()">保存</button>
      <button class="btn btn-danger" onclick="closeModal('addModal')">取消</button>
    </div>
  </div>

  <script>
    const API_BASE = 'https://sturgeon-movies-api.zhx100560.workers.dev/api';

    let isRegisterMode = false;
    let currentTab = 'all';
    let moviesData = [];

    window.onload = () => {
      checkAuthStatus();
      if (getToken()) {
        fetchMovies();
      }
    };

    function getToken() {
      return localStorage.getItem('token');
    }

    function checkAuthStatus() {
      const username = localStorage.getItem('username');
      const userInfo = document.getElementById('userInfo');
      const authBtn = document.getElementById('authBtn');

      if (username && getToken()) {
        userInfo.innerText = `👋 欢迎，${username}`;
        authBtn.innerText = '退出登录';
        authBtn.onclick = logout;
      } else {
        userInfo.innerText = '未登录';
        authBtn.innerText = '登录 / 注册';
        authBtn.onclick = () => openModal('authModal');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      moviesData = [];
      renderMovies();
      checkAuthStatus();
    }

    async function apiFetch(endpoint, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      const token = getToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);

      const res = await fetch(`${API_BASE}${endpoint}`, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    async function fetchMovies() {
      try {
        moviesData = await apiFetch('/movies');
        renderMovies();
      } catch (err) {
        alert(err.message);
      }
    }

    function getCategoryIcon(category) {
      switch (category) {
        case 'tv': return '📺';
        case 'anime': return '🎨';
        case 'movie': default: return '🎬';
      }
    }

    function renderMovies() {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';

      const filtered = moviesData.filter(m => {
        if (currentTab === 'all') return true;
        return m.type === currentTab;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 50px; background: var(--glass-card-gradient); border-radius: 20px; backdrop-filter: blur(20px); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-glow);">暂无记录，点击右下角 + 按钮添加吧！</div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';

        const icon = getCategoryIcon(m.category || 'movie');

        let extHtml = '';
        if (m.type === 'plan' && m.external_rating) {
          extHtml = `
            <div class="external-box">
              ⭐ 推荐评分: <strong>${m.external_rating}</strong><br>
              ${m.external_comment || ''}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="movie-title"><span>${icon}</span> ${m.title}</div>
          <div class="movie-meta">
            ${m.type === 'watched' ? '✅ 已观看' : '📌 计划看'} 
            ${m.rating ? `| <span class="rating">★ ${m.rating}/10</span>` : ''}
          </div>
          ${m.description ? `<p style="font-size: 0.9rem; color: #e2e8f0;">${m.description}</p>` : ''}
          ${extHtml}
          <div class="card-actions">
            ${m.type === 'plan' ? `<button class="btn btn-secondary" onclick="markAsWatched(${m.id})">标记已看</button>` : ''}
            <button class="btn btn-danger" onclick="deleteMovie(${m.id})">删除</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function switchTab(type, el) {
      currentTab = type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderMovies();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function switchAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('modalTitle').innerText = isRegisterMode ? '注册' : '登录';
      document.getElementById('switchAuthBtn').innerText = isRegisterMode ? '已有账号？去登录' : '没有账号？去注册';
    }

    async function submitAuth() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      if (!username || !password) return alert('请填写用户名和密码');

      try {
        const endpoint = isRegisterMode ? '/register' : '/login';
        const res = await apiFetch(endpoint, 'POST', { username, password });

        if (isRegisterMode) {
          alert('注册成功，请重新登录');
          switchAuthMode();
        } else {
          localStorage.setItem('token', res.token);
          localStorage.setItem('username', res.username);
          closeModal('authModal');
          checkAuthStatus();
          fetchMovies();
        }
      } catch (err) {
        alert(err.message);
      }
    }

    function openAddModal() {
      if (!getToken()) return alert('请先登录后再添加记录');
      openModal('addModal');
    }

    async function submitAddMovie() {
      const title = document.getElementById('movieTitle').value.trim();
      const category = document.getElementById('mediaCategory').value;
      const type = document.getElementById('movieType').value;
      const rating = parseFloat(document.getElementById('movieRating').value) || 0;
      const description = document.getElementById('movieDesc').value.trim();

      if (!title) return alert('请输入作品名称');

      const saveBtn = document.querySelector('#addModal .btn:not(.btn-danger)');
      const originalText = saveBtn.innerText;
      saveBtn.innerText = type === 'plan' ? '🔍 正在全网检索评分...' : '保存中...';
      saveBtn.disabled = true;

      try {
        await apiFetch('/movies', 'POST', { title, category, type, rating, description });
        closeModal('addModal');
        document.getElementById('movieTitle').value = '';
        document.getElementById('movieDesc').value = '';
        fetchMovies();
      } catch (err) {
        alert(err.message);
      } finally {
        saveBtn.innerText = originalText;
        saveBtn.disabled = false;
      }
    }

    async function markAsWatched(id) {
      const rating = prompt('请输入你的评分 (1-10)：', '8');
      if (rating === null) return;

      try {
        await apiFetch(`/movies/${id}`, 'PUT', {
          type: 'watched',
          rating: parseFloat(rating) || 0,
          description: '已更新为已观看'
        });
        fetchMovies();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteMovie(id) {
      if (!confirm('确定要删除这部作品记录吗？')) return;
      try {
        await apiFetch(`/movies/${id}`, 'DELETE');
        fetchMovies();
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
